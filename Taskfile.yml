version: "3"

vars:
  GOLANGCI_LINT_VERSION: v2.12.2

tasks:
  default:
    cmds:
      - task: app:dev
    silent: true

  frontend:build:
    desc: Build the Vue frontend
    dir: frontend
    cmds:
      - npm run build

  wails:install:
    desc: Install the pinned Wails CLI version
    internal: true
    cmds:
      - go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m github.com/wailsapp/wails/v2 | cut -d' ' -f2)

  app:build:
    desc: Build the production binary with VCS info embedded
    deps: [wails:install]
    vars:
      REVISION:
        sh: git rev-parse --short HEAD
      MODIFIED:
        sh: git diff --quiet && echo false || echo true
    cmds:
      - go mod tidy
      - wails build -tags webkit2_41 -ldflags "-X github.com/rhemvi/omaclip/foundation/vcs.Revision={{.REVISION}} -X github.com/rhemvi/omaclip/foundation/vcs.Modified={{.MODIFIED}}"

  app:dev:
    desc: Start the application in development mode
    deps: [wails:install]
    cmds:
      - wails dev

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  golangci-lint:install:
    desc: Install the pinned golangci-lint version when it is missing or outdated
    internal: true
    status:
      - test "v$(golangci-lint version --short)" = "{{.GOLANGCI_LINT_VERSION}}"
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}

  lint:
    desc: Run golangci-lint
    deps: [golangci-lint:install]
    cmds:
      - golangci-lint run ./...

  aur:clean:
    desc: Remove downloaded omaclip-linux-* binaries from build/aur
    dir: build/aur
    cmds:
      - rm -f omaclip-linux-*

  aur:checksums:
    desc: Regenerate checksums and .SRCINFO for the AUR omaclip-bin package
    dir: build/aur
    deps: [aur:clean]
    cmds:
      - updpkgsums
      - makepkg --printsrcinfo > .SRCINFO

  aur:publish:
    desc: Update and push the AUR omaclip-bin package
    dir: build/aur
    deps: [aur:checksums]
    vars:
      VERSION:
        sh: grep '^pkgver=' PKGBUILD | cut -d= -f2
      AUR_REPO: /tmp/omaclip-bin-aur
    cmds:
      - rm -rf {{.AUR_REPO}}
      - git clone ssh://aur@aur.archlinux.org/omaclip-bin.git {{.AUR_REPO}}
      - cp PKGBUILD .SRCINFO omaclip.desktop {{.AUR_REPO}}/
      - cd {{.AUR_REPO}} && git add -A && git commit -m "Update to {{.VERSION}}" && git push
      - rm -rf {{.AUR_REPO}}
